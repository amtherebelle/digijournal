<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asma's Journal</title>
<meta name="theme-color" content="#A5406A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" href="icon192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Dancing+Script:wght@600;700&family=Karla:wght@400;500;700&display=swap">
<style id="app-style">/* ---------- tokens: Asma's "Blush Palette" (Snow / Misty Rose / Petal Pink / Orchid Pink / Amaranth Pink) ---------- */
:root{
  --cream:#F5EAE5;
  --cream-deep:#EFD9DA;
  --card:#FFFBFA;
  --pink-pale:#EFD9DA;
  --pink:#E8B4B8;
  --pink-deep:#C97B93;
  --burgundy:#A5406A;
  --gold:#B98D3E;
  --gold-soft:#E4CFA0;
  --ink:#4A3439;
  --ink-soft:#8A6B71;
  --line:rgba(165,64,106,0.14);
  --shadow:0 18px 40px -24px rgba(165,64,106,0.35);
  --radius:22px;
  --mood-radiant:#C99A3B;
  --mood-content:#D98CA4;
  --mood-steady:#B08A94;
  --mood-heavy:#8C6E77;
  --mood-stormy:#6B4450;
  --star-on:#C97B93;
  --star-off:#DCC7C4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#251A1F;
    --cream-deep:#2D2126;
    --card:#302328;
    --pink-pale:#3D2A31;
    --pink:#C97B93;
    --pink-deep:#E8B4B8;
    --burgundy:#F0BFCF;
    --gold:#D9B36A;
    --gold-soft:#4A3B2C;
    --ink:#F5E9EC;
    --ink-soft:#CBA9B1;
    --line:rgba(245,233,236,0.14);
    --shadow:0 18px 40px -22px rgba(0,0,0,0.55);
    --mood-radiant:#E3BE72;
    --mood-content:#E8B4B8;
    --mood-steady:#C9A2AC;
    --mood-heavy:#A98891;
    --mood-stormy:#9A6B78;
    --star-on:#E8B4B8;
    --star-off:#4A363C;
  }
}
:root[data-theme="dark"]{
  --cream:#251A1F;
  --cream-deep:#2D2126;
  --card:#302328;
  --pink-pale:#3D2A31;
  --pink:#C97B93;
  --pink-deep:#E8B4B8;
  --burgundy:#F0BFCF;
  --gold:#D9B36A;
  --gold-soft:#4A3B2C;
  --ink:#F5E9EC;
  --ink-soft:#CBA9B1;
  --line:rgba(245,233,236,0.14);
  --shadow:0 18px 40px -22px rgba(0,0,0,0.55);
  --mood-radiant:#E3BE72;
  --mood-content:#E8B4B8;
  --mood-steady:#C9A2AC;
  --mood-heavy:#A98891;
  --mood-stormy:#9A6B78;
  --star-on:#E8B4B8;
  --star-off:#4A363C;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);
  color:var(--ink);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  line-height:1.5;
}
::selection{background:var(--pink-pale);color:var(--burgundy);}

h1,h2,h3{
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  color:var(--burgundy);
  margin:0;
  text-wrap:balance;
  font-weight:600;
}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- divider ---------- */
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 0;color:var(--gold);opacity:.85;}
.divider svg{width:120px;height:14px;display:block;}
.divider .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}

/* ---------- header ---------- */
.hero{
  background:linear-gradient(155deg,var(--pink-pale) 0%,var(--card) 62%);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:38px clamp(20px,5vw,52px);
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(120px 120px at 92% -10%, var(--gold-soft), transparent 70%);
  pointer-events:none;
  opacity:.6;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.eyebrow{
  font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;
}
.hero h1{
  font-family:'Dancing Script','Cormorant Garamond',serif;
  font-weight:700;
  font-size:clamp(42px,6vw,62px);
  margin-top:2px;
  color:var(--burgundy);
}
.hero .tagline{color:var(--ink-soft);font-size:15.5px;margin-top:6px;max-width:46ch;}
.hero .date-badge{
  font-family:'Cormorant Garamond',serif;
  font-size:17px;color:var(--burgundy);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 18px;
  white-space:nowrap;
  box-shadow:0 6px 16px -10px rgba(125,58,76,.4);
}
.affirmation{
  margin-top:22px;
  font-family:'Dancing Script','Cormorant Garamond',serif;
  font-weight:600;
  font-size:24px;
  color:var(--burgundy);
  border-left:3px solid var(--gold);
  padding-left:16px;
}

.mood-row{margin-top:26px;}
.mood-label{font-size:13px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;font-weight:700;margin-bottom:10px;}
.mood-pills{display:flex;gap:10px;flex-wrap:wrap;}
.mood-pill{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:999px;
  padding:9px 17px;
  font-size:14.5px;
  cursor:pointer;
  font-family:'Karla',sans-serif;
  transition:transform .15s ease, box-shadow .15s ease;
  display:flex;align-items:center;gap:8px;
}
.mood-pill:hover{transform:translateY(-1px);}
.mood-pill .swatch{width:9px;height:9px;border-radius:50%;}
.mood-pill[data-active="true"]{
  background:var(--burgundy);
  color:#fff;
  border-color:var(--burgundy);
  box-shadow:0 8px 18px -10px rgba(125,58,76,.6);
}

.icon-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--burgundy);
  width:38px;height:38px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;
  flex-shrink:0;
}
.icon-btn:hover{background:var(--pink-pale);}

/* ---------- section shell ---------- */
.section{margin-top:44px;}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.section-head h2{font-size:27px;font-style:italic;font-weight:600;}
.section-sub{color:var(--ink-soft);font-size:14px;}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px clamp(18px,4vw,30px);
}

/* ---------- habit tracker ---------- */
.week-nav{display:flex;align-items:center;gap:10px;}
.week-nav span{font-size:13.5px;color:var(--ink-soft);min-width:118px;text-align:center;font-variant-numeric:tabular-nums;}
.habit-table{width:100%;border-collapse:collapse;}
.habit-table th{
  font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);
  padding:0 6px 12px;text-align:center;
}
.habit-table th:first-child{text-align:left;padding-left:0;}
.habit-table td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);}
.habit-table td:first-child{text-align:left;padding-left:0;}
.habit-name{display:flex;align-items:center;gap:10px;font-size:15px;}
.habit-name .rm{opacity:0;cursor:pointer;color:var(--ink-soft);font-size:13px;transition:opacity .12s;}
tr:hover .habit-name .rm{opacity:1;}
.chk{
  width:30px;height:30px;border-radius:9px;
  border:1.5px solid var(--line);
  background:var(--cream);
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s, border-color .15s, transform .1s;
}
.chk:hover{transform:scale(1.08);}
.chk svg{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:1.6;transition:fill .15s,stroke .15s;}
.chk[data-on="true"]{background:var(--pink-pale);border-color:var(--pink-deep);}
.chk[data-on="true"] svg{fill:var(--pink-deep);stroke:var(--pink-deep);}
.streak{font-size:12.5px;color:var(--gold);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.add-habit-row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;}
.add-habit-row input{flex:1;min-width:120px;}
.add-habit-row select{flex:0 0 150px;}

/* ---------- inputs ---------- */
input[type="text"], input[type="number"], textarea{
  font-family:'Karla',sans-serif;
  font-size:14.5px;
  color:var(--ink);
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  width:100%;
}
input:focus, textarea:focus, button:focus-visible, .chk:focus-visible, .mood-pill:focus-visible{
  outline:2px solid var(--pink-deep);outline-offset:2px;
}
textarea{resize:vertical;min-height:90px;font-family:'Karla',sans-serif;line-height:1.6;}
.btn{
  font-family:'Karla',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.02em;
  border:none;border-radius:999px;padding:10px 20px;cursor:pointer;
  background:var(--burgundy);color:#fff;white-space:nowrap;
}
.btn:hover{opacity:.92;}
.btn.ghost{background:transparent;border:1px solid var(--burgundy);color:var(--burgundy);}
:root[data-theme="dark"] .btn{color:var(--cream);}
@media (prefers-color-scheme:dark){.btn{color:var(--cream);}}

/* ---------- creative studio ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:820px){.grid-2{grid-template-columns:1fr;}}
.project-card h3{font-size:21px;}
.project-meta{color:var(--ink-soft);font-size:12.5px;margin-top:3px;}
.progress-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
.progress-track{flex:1;height:10px;border-radius:999px;background:var(--pink-pale);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--gold));border-radius:999px;transition:width .25s ease;}
.progress-pct{font-size:13px;font-weight:700;color:var(--burgundy);width:38px;text-align:right;font-variant-numeric:tabular-nums;}
.progress-btns{display:flex;gap:6px;margin-top:8px;}
.progress-btns button{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--burgundy);cursor:pointer;font-size:15px;
}
.note-area{margin-top:14px;}
.note-area label, .idea-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:6px;}
.idea-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.idea-list li{
  display:flex;align-items:flex-start;gap:8px;font-size:14px;background:var(--cream);border-radius:10px;padding:8px 10px;
}
.idea-list li .dot{color:var(--gold);flex-shrink:0;}
.idea-list li .txt{flex:1;}
.idea-list li .del{cursor:pointer;color:var(--ink-soft);font-size:12px;flex-shrink:0;}
.add-idea{display:flex;gap:8px;margin-top:10px;}

/* ---------- goals ---------- */
.milestone-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;}
.milestone{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);}
.milestone:first-child{border-top:none;}
.milestone .label{flex:1;font-size:14.5px;}
.milestone[data-done="true"] .label{color:var(--ink-soft);text-decoration:line-through;}
.milestone .del{cursor:pointer;color:var(--ink-soft);font-size:12px;opacity:0;}
.milestone:hover .del{opacity:1;}

.savings-box{margin-top:8px;}
.savings-figures{display:flex;justify-content:space-between;align-items:baseline;font-family:'Cormorant Garamond',serif;}
.savings-figures .cur{font-size:30px;color:var(--burgundy);font-weight:600;font-variant-numeric:tabular-nums;}
.savings-figures .tgt{font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.savings-edit{display:flex;gap:8px;margin-top:12px;}
.savings-edit input{width:auto;flex:1;}

.goal-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;}
.goal-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);}
.goal-item:first-child{border-top:none;}
.goal-item .label{flex:1;font-size:14.5px;}
.goal-item[data-done="true"] .label{color:var(--ink-soft);text-decoration:line-through;}
.goal-item .del{cursor:pointer;color:var(--ink-soft);font-size:12px;opacity:0;}
.goal-item:hover .del{opacity:1;}
.check{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--pink-deep);cursor:pointer;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;background:transparent;
}
.check[data-done="true"]{background:var(--pink-deep);}

.empty-note{color:var(--ink-soft);font-size:13.5px;font-style:italic;padding:6px 0 2px;}

/* ---------- journal ---------- */
.journal-entries{margin-top:22px;display:flex;flex-direction:column;gap:14px;}
.entry{background:var(--cream);border-radius:14px;padding:14px 16px;position:relative;}
.entry .entry-date{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.03em;}
.entry .entry-text{margin-top:6px;font-size:14.5px;white-space:pre-wrap;}
.entry .del{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--ink-soft);font-size:12px;opacity:0;}
.entry:hover .del{opacity:1;}

/* ---------- footer ---------- */
.footer{margin-top:56px;text-align:center;color:var(--ink-soft);font-size:12.5px;}
.footer .save-state{margin-top:8px;font-size:12px;}
.footer .save-state[data-state="saving"]{color:var(--gold);}
.footer .save-state[data-state="saved"]{color:var(--ink-soft);}
.footer .save-state[data-state="offline"]{color:var(--pink-deep);}

.theme-toggle{
  border:1px solid var(--line);background:var(--card);color:var(--burgundy);
  border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:'Karla',sans-serif;font-weight:700;
}

/* ---------- grouped habit table ---------- */
tr.group-row td{
  padding:16px 6px 8px 0;
  font-family:'Cormorant Garamond',serif;
  font-size:17px;
  font-weight:600;
  color:var(--gold);
  border-top:none;
}
tr.group-row:first-child td{padding-top:2px;}
tr.add-row td{border-top:none;padding-top:4px;padding-bottom:14px;}
.add-habit-inline{display:flex;gap:8px;max-width:420px;}
.add-habit-inline input{flex:1;}
.btn.sm{padding:8px 14px;font-size:12.5px;}

select{
  font-family:'Karla',sans-serif;
  font-size:14.5px;
  color:var(--ink);
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
}
input[type="date"]{color:var(--ink);}

/* ---------- daily check-in ---------- */
.grat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
.grat-row label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:6px;}
#checkin-win{margin-top:0;}
.section .card > label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:6px;}
.checkin-history{margin-top:20px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px;}
.checkin-entry .entry-date{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.03em;}
.checkin-win{font-size:14px;margin-top:4px;}
.checkin-grat{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-soft);}
.checkin-grat li{margin-top:2px;}

/* ---------- creative studio: posted toggle ---------- */
.post-toggle{
  margin-top:14px;
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--line);
  background:var(--cream);
  border-radius:14px;
  padding:12px 16px;
  cursor:pointer;
  font-family:'Karla',sans-serif;
  font-size:14.5px;
  font-weight:700;
  color:var(--ink);
  width:100%;
  text-align:left;
}
.post-check{
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--pink-deep);
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;flex-shrink:0;
}
.post-toggle[data-on="true"]{background:var(--pink-pale);border-color:var(--pink-deep);}
.post-toggle[data-on="true"] .post-check{background:var(--pink-deep);}

/* ---------- PT quals ---------- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:1000px){.grid-3{grid-template-columns:1fr 1fr;}}
@media (max-width:700px){.grid-3{grid-template-columns:1fr;}}
.unit-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:16px;}
.unit-row{border-top:1px solid var(--line);padding-top:14px;}
.unit-row:first-child{border-top:none;padding-top:0;}
.unit-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.unit-name{font-size:13.5px;font-weight:700;}
.unit-status{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.unit-status[data-status="active"]{color:var(--gold);}
.unit-status[data-status="done"]{color:var(--pink-deep);}

/* ---------- media lists ---------- */
.media-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;}
.media-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.media-row:first-child{border-top:none;}
.media-row .txt{flex:1;font-size:14.5px;}
.media-row .media-date{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.media-row .del{cursor:pointer;color:var(--ink-soft);font-size:12px;opacity:0;}
.media-row:hover .del{opacity:1;}

/* ---------- bucket list ---------- */
.bucket-cat{margin-top:16px;}
.bucket-cat:first-child{margin-top:0;}
.bucket-cat-name{
  font-family:'Cormorant Garamond',serif;font-size:16.5px;font-weight:600;color:var(--gold);margin-bottom:4px;
}

/* ---------- star ratings ---------- */
.stars{display:inline-flex;gap:2px;}
.stars .star{
  cursor:pointer;font-size:16px;line-height:1;color:var(--star-off);
  transition:color .1s, transform .1s;
}
.stars .star:hover{transform:scale(1.15);}
.stars .star[data-on="true"]{color:var(--star-on);}
.stars.picker{margin-top:2px;}
.media-row .stars{margin-left:auto;margin-right:8px;}
.new-rating-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.new-rating-row .stars .star{font-size:20px;}
.new-rating-row label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;}

/* ---------- series / episode tracker ---------- */
.series-card{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.series-card:first-child{margin-top:0;padding-top:0;border-top:none;}
.series-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.series-title{font-weight:700;font-size:14.5px;}
.series-top .del{cursor:pointer;color:var(--ink-soft);font-size:12px;}
.season-block{margin-top:10px;}
.season-label{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.03em;margin-bottom:6px;}
.episode-row{display:flex;flex-wrap:wrap;gap:6px;}
.ep-box{
  width:26px;height:26px;border-radius:7px;
  border:1.5px solid var(--line);
  background:var(--cream);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-soft);
  cursor:pointer;font-variant-numeric:tabular-nums;
}
.ep-box[data-on="true"]{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff;}
.add-season-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
.add-season-row input{max-width:110px;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
</head>
